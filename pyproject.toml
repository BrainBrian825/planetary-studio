[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "planetary-studio"
version = "0.1.1"
description = "Capture, prepare, stack, and sharpen planetary images in one desktop application"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{name = "Planetary Studio contributors"}]
dependencies = [
  "numpy>=2.2,<3", "scipy>=1.15,<2", "opencv-python-headless>=4.11,<6",
  "PySide6>=6.8,<7", "astropy>=7,<9", "tifffile>=2025", "pillow>=11,<14", "certifi"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.15", "ruff>=0.12"]

[project.scripts]
planetary-studio = "planetary_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planetary_studio = ["native/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
