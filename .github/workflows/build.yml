name: Build and verify Planetary Studio

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            platform: macOS-arm64
          - os: windows-latest
            platform: Windows-x64
          - os: ubuntu-24.04
            platform: Linux-x64
          - os: ubuntu-24.04-arm
            platform: Linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install libusb pkgconf
      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt && python -m pip install --no-deps -e .
      - name: Compile raw UVC camera support
        run: python native/build.py
      - name: Test image processing, formats, protocols and desktop
        run: python -m pytest -q
      - name: Verify source application
        run: python -m planetary_studio --self-test --report build/source-selftest.json
      - name: Package native desktop application
        run: python -m PyInstaller --clean --noconfirm packaging/planetary-studio.spec
      - name: Verify packaged macOS application
        if: runner.os == 'macOS'
        run: |
          test "$(lipo -archs 'dist/Planetary Studio.app/Contents/MacOS/PlanetaryStudio')" = arm64
          'dist/Planetary Studio.app/Contents/MacOS/PlanetaryStudio' --self-test --report build/package-selftest.json
      - name: Verify packaged Windows application
        if: runner.os == 'Windows'
        run: |
          & dist/PlanetaryStudio/PlanetaryStudio.exe --self-test --report build/package-selftest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged Linux application
        if: runner.os == 'Linux'
        run: dist/PlanetaryStudio/PlanetaryStudio --self-test --report build/package-selftest.json
      - name: Create portable download
        run: python packaging/archive.py
      - uses: actions/upload-artifact@v6
        with:
          name: PlanetaryStudio-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            build/*selftest.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          path: release-files
      - name: Publish tested downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -t archives < <(find release-files -type f \( -name '*.zip' -o -name '*.tar.gz' \))
          gh release create "$RELEASE_TAG" "${archives[@]}" --title "Planetary Studio $RELEASE_TAG" --notes-file RELEASE_NOTES.md --prerelease
